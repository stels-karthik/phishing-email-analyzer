services:
  # Backend API Service
  - type: web
    name: phishing-analyzer-api
    runtime: python
    region: oregon
    plan: free
    branch: master
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: API_HOST
        value: "0.0.0.0"
      - key: CACHE_TTL_HOURS
        value: "24"
      - key: MAX_REQUESTS_PER_MINUTE
        value: "30"
